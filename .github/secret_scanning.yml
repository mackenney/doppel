# doppel deliberately uses structurally-valid fake secrets as test vectors.
# These are synthetic values that match real formats but are not and have never
# been active credentials. Excluding the test tree avoids false-positive push
# protection blocks on every new pattern we add.
paths-ignore:
  - "doppel/tests/spec/inv.rs"
  - "doppel/tests/integration/round_trip.rs"
  - "doppel/tests/integration/detector.rs"
  - "doppel-cli/tests/e2e/cli.rs"
