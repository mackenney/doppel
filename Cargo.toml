[package]
name = "its-classified"
version = "0.1.0"
edition = "2024"

[profile.dev]
debug = 2

[profile.dev.package."*"]
debug = "line-tables-only"

[[bin]]
name = "its-classified"
path = "src/main.rs"

[dependencies]
chacha20poly1305 = "0.10"
hmac = "0.12"
sha2 = "0.10"
rand = { version = "0.8", features = ["std", "std_rng"] }
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
subtle = "2"
aho-corasick = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "1"

[dev-dependencies]
zeroize = { version = "1", features = ["derive"] }
rand = { version = "0.8", features = ["std", "std_rng"] }
tempfile = "3"
[features]
test-e2e = []
