[package]
name = "doppel-cli"
version = "0.1.0"
edition = "2024"
description = "CLI for doppel: swap secrets in payloads with fakes and restore them in streaming responses."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mackenney/doppel"
documentation = "https://docs.rs/doppel-cli"
rust-version = "1.85"
readme = "../README.md"
keywords = ["secrets", "redaction", "proxy", "anonymization", "llm"]
categories = ["command-line-utilities"]

[[bin]]
name = "doppel"
path = "src/main.rs"
doc = false

[dependencies]
doppel = { path = "../doppel", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
zeroize = "1"
rand = { version = "0.8", features = ["std", "std_rng"] }
toml_edit = { version = "0.22", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
toml = "0.8"

[features]
test-e2e = []
