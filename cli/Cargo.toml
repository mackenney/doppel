[package]
name = "its-classified-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "its-classified"
path = "src/main.rs"
doc = false

[dependencies]
its-classified = { path = ".." }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"

[features]
test-e2e = []
